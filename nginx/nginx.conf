# Global events configuration
events { worker_connections 1024; }

http {
  # Define a group of backend servers with passive health checks
  upstream backend {
    # Mark server as down for 30s if it fails 3 times
    server backend:8080 max_fails=3 fail_timeout=30s;
  }

  # Logging settings
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 80;

    location / {
      # Forward traffic to the upstream group defined above
      proxy_pass http://backend;

      # Pass original client information to the application
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
